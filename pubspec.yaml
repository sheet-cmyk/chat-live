name: party_hub
description: Party Hub - Social Voice Chat Party App
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.0.1

  # Firebase
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.2
  cloud_firestore: ^5.1.0
  firebase_storage: ^12.1.1
  firebase_messaging: ^15.0.3
  firebase_crashlytics: ^4.0.3
  firebase_remote_config: ^5.0.3

  # Social Login (Phase 2A)
  google_sign_in: ^6.2.1
  # flutter_facebook_auth: ^7.0.1    # add in Phase 2A
  # sign_in_with_apple: ^6.1.1       # add in Phase 2A

  # Voice/Video
  zego_express_engine: ^3.14.5

  # UI & Media
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  flutter_screenutil: ^5.9.1
  lottie: ^3.1.2
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.0+3
  flutter_svg: ^2.0.10+1
  badges: ^3.1.2

  # Local Storage
  shared_preferences: ^2.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Networking
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3

  # Models & Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Permissions
  permission_handler: ^11.3.1

  # Utils
  intl: ^0.20.2
  equatable: ^2.0.5
  uuid: ^4.4.0
  timeago: ^3.6.1
  url_launcher: ^6.3.0
  path_provider: ^2.1.3

  # Audio & Notifications
  flutter_local_notifications: ^18.0.1
  audioplayers: ^6.1.0
  flutter_animate: ^4.3.0

  # Provider (used by Sweet Bonanza game)
  provider: ^6.1.1

  # In-App Purchase (Phase 5B)
  # in_app_purchase: ^3.2.0          # add in Phase 5B

  # Emoji (Phase 4C)
  # emoji_picker_flutter: ^2.2.0     # add in Phase 4C

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.a1.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon.a1.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/icon.a1.png"
    background_color: "#FFFFFF"
    theme_color: "#6C5CE7"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icon/
    - assets/icons/
    - assets/animations/
    - assets/sounds/
    - assets/sweet_bonanza/images/
    - assets/sweet_bonanza/images/backgrounds/
    - assets/sweet_bonanza/images/symbols/
    - assets/sweet_bonanza/sound/
    - assets/sweet_bonanza/icons/
    - assets/game-assets/
    - assets/game-assets/dice/
    - assets/game-assets/chips/
    - assets/game-assets/ui/
