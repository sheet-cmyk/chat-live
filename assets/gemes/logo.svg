<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D0"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8A6318"/>
    </linearGradient>
  </defs>

  <!-- decorative winged scarab flanks -->
  <g transform="translate(90,130)">
    <path d="M0 0 Q-70 -30 -85 10 Q-50 5 -25 15 Q-55 20 -70 45 Q-30 25 0 20 Z" fill="#2E8B8B" stroke="#3B2412" stroke-width="3"/>
  </g>
  <g transform="translate(810,130) scale(-1,1)">
    <path d="M0 0 Q-70 -30 -85 10 Q-50 5 -25 15 Q-55 20 -70 45 Q-30 25 0 20 Z" fill="#2E8B8B" stroke="#3B2412" stroke-width="3"/>
  </g>

  <text x="450" y="130" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="bold"
        text-anchor="middle" fill="url(#logoGold)" stroke="#3B2412" stroke-width="3">RA'S GAZE</text>

  <line x1="150" y1="165" x2="750" y2="165" stroke="#D4AF37" stroke-width="4"/>
  <text x="450" y="200" font-family="Georgia, serif" font-size="30" letter-spacing="6" text-anchor="middle" fill="#F4E4BC">EYE OF THE SUN GOD</text>
</svg>
