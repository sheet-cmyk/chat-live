      <stop offset="0%" stop-color="#C23B2A"/>
      <stop offset="100%" stop-color="#7A1E15"/>
    </linearGradient>
    <linearGradient id="wingTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E8B8B"/>
      <stop offset="100%" stop-color="#164B4B"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="284" height="284" rx="24" fill="#2A1608"/>
  <rect x="8" y="8" width="284" height="284" rx="24" fill="none" stroke="#D4AF37" stroke-width="8"/>

  <!-- body -->
  <ellipse cx="150" cy="170" rx="34" ry="46" fill="#D4AF37" stroke="#3B2412" stroke-width="4"/>

