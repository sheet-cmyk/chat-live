<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="banGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D0"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8A6318"/>
    </linearGradient>
    <radialGradient id="banGlow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#5C2E12"/>
      <stop offset="100%" stop-color="#1A0D06"/>
    </radialGradient>
  </defs>
  <rect width="800" height="300" fill="url(#banGlow)"/>
  <rect x="20" y="20" width="760" height="260" fill="none" stroke="#D4AF37" stroke-width="6" rx="20"/>

  <!-- winged sun disc -->
  <g transform="translate(400,60)">
    <circle r="20" fill="#D4AF37" stroke="#3B2412" stroke-width="3"/>
    <path d="M-90 10 Q-40 -20 -8 6" fill="none" stroke="#2E8B8B" stroke-width="10" stroke-linecap="round"/>
    <path d="M90 10 Q40 -20 8 6" fill="none" stroke="#2E8B8B" stroke-width="10" stroke-linecap="round"/>
  </g>

  <text x="400" y="165" font-family="Georgia, serif" font-size="72" font-weight="bold" text-anchor="middle"
        fill="url(#banGold)" stroke="#3B2412" stroke-width="3">15 FREE SPINS</text>
  <text x="400" y="220" font-family="Georgia, serif" font-size="28" letter-spacing="4" text-anchor="middle" fill="#F4E4BC">SYMBOLS UPGRADE EACH SPIN</text>
</svg>
