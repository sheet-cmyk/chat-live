<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A2A12"/>
      <stop offset="55%" stop-color="#2A160A"/>
      <stop offset="100%" stop-color="#150B05"/>
    </linearGradient>
    <linearGradient id="pillarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7A5024"/>
      <stop offset="50%" stop-color="#B8843F"/>
      <stop offset="100%" stop-color="#5A3814"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bgSky)"/>

  <!-- left pillar -->
  <rect x="0" y="0" width="120" height="720" fill="url(#pillarGrad)"/>
  <rect x="120" y="0" width="18" height="720" fill="#2A160A"/>
  <!-- right pillar -->
  <rect x="1160" y="0" width="120" height="720" fill="url(#pillarGrad)" transform="scale(-1,1) translate(-2560,0)"/>
  <rect x="1142" y="0" width="18" height="720" fill="#2A160A"/>

  <!-- carved bands on pillars -->
  <g fill="none" stroke="#3B2412" stroke-width="4" opacity="0.5">
    <rect x="20" y="40" width="80" height="80"/>
    <rect x="20" y="150" width="80" height="80"/>
    <rect x="20" y="260" width="80" height="80"/>
    <rect x="1180" y="40" width="80" height="80"/>
    <rect x="1180" y="150" width="80" height="80"/>
    <rect x="1180" y="260" width="80" height="80"/>
  </g>

  <!-- distant sun glow at top center -->
  <circle cx="640" cy="60" r="140" fill="#E8862B" opacity="0.25"/>

  <!-- reel panel area (place reels/grid on top of this) -->
  <rect x="150" y="120" width="980" height="480" rx="12" fill="#1A0D06" opacity="0.55"/>
</svg>
